on:
  push:
    branches:
      - '**'

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build api1 image
        run: docker build -t api1:latest ./api1

      - name: Build api2 image
        run: docker build -t api2:latest ./api2

      - name: Build frontend image
        run: docker build -t frontend:latest ./frontend

      - name: Scan api1 with Trivy
        uses: aquasec/trivy-action@master
        with:
          image-ref: 'api1:latest'
          severity: 'MEDIUM,HIGH,CRITICAL'
          exit-code: '1'

      - name: Scan api2 with Trivy
        uses: aquasec/trivy-action@master
        with:
          image-ref: 'api2:latest'
          severity: 'MEDIUM,HIGH,CRITICAL'
          exit-code: '1'

      - name: Scan frontend with Trivy
        uses: aquasec/trivy-action@master
        with:
          image-ref: 'frontend:latest'
          severity: 'MEDIUM,HIGH,CRITICAL'
          exit-code: '1'

  build-and-push:
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push api1
        uses: docker/build-push-action@v5
        with:
          context: ./api1
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/team02-api1:latest

      - name: Build and push api2
        uses: docker/build-push-action@v5
        with:
          context: ./api2
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/team02-api2:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/team02-frontend:latest