on:
  push:
    branches:
      - '**'

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build api1 image
        run: docker build -t api1:latest ./api1

      - name: Build api2 image
        run: docker build -t api2:latest ./api2

      - name: Build frontend image
        run: docker build -t frontend:latest ./frontend

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan api1 with Trivy
        run: trivy image --exit-code 1 --severity MEDIUM,HIGH,CRITICAL --ignorefile .trivyignore api1:latest

      - name: Scan api2 with Trivy
        run: trivy image --exit-code 1 --severity MEDIUM,HIGH,CRITICAL --ignorefile .trivyignore api2:latest

      - name: Scan frontend with Trivy
        run: trivy image --exit-code 1 --severity MEDIUM,HIGH,CRITICAL --ignorefile .trivyignore frontend:latest

  build-and-push:
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push api1
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/team02-api1:latest ./api1
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/team02-api1:latest

      - name: Build and push api2
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/team02-api2:latest ./api2
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/team02-api2:latest

      - name: Build and push frontend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/team02-frontend:latest ./frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/team02-frontend:latest